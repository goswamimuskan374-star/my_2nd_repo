<template>

    <!-- Header -->
    <header class="top-header">

        <div class="brand-section">

            <div class="brand-icon">
                <lightning-icon
                    icon-name="utility:task"
                    alternative-text="Work Tracker"
                    size="medium">
                </lightning-icon>
            </div>

            <div>
                <div class="brand-title">
                    Work Tracker
                </div>

                <div class="brand-subtitle">
                    Track your tasks. Stay productive.
                </div>
            </div>

        </div>

        <div class="user-section">

            <div class="user-avatar">
                <lightning-icon
                    icon-name="utility:user"
                    alternative-text="User"
                    size="small">
                </lightning-icon>
            </div>

            <span>
                Hello, {userName}
            </span>

            <lightning-icon
                icon-name="utility:chevrondown"
                alternative-text="Menu"
                size="x-small">
            </lightning-icon>

        </div>

    </header>


    <!-- Main -->
    <main class="main-container">

        <!-- Welcome -->
        <section class="welcome-card">

            <div class="welcome-icon">
                <lightning-icon
                    icon-name="utility:task"
                    alternative-text="Tasks"
                    size="large">
                </lightning-icon>
            </div>

            <div class="welcome-content">

                <h1>Welcome Back!</h1>

                <p>
                    Here are your assigned requirements.
                </p>

            </div>

        </section>


        <!-- Requirements -->
        <section class="requirements-card">

            <div class="card-header">

                <div class="card-title-section">

                    <lightning-icon
                        icon-name="utility:task"
                        alternative-text="Requirements"
                        size="small">
                    </lightning-icon>

                    <h2>My Requirements</h2>

                </div>

            </div>


            <!-- Loading -->
            <template if:true={isLoading}>

                <div class="loading-section">

                    <lightning-spinner
                        alternative-text="Loading">
                    </lightning-spinner>

                </div>

            </template>


            <!-- Error -->
            <template if:true={errorMessage}>

                <div class="error-section">
                    {errorMessage}
                </div>

            </template>


            <!-- No Requirements -->
            <template if:true={showNoRecords}>

                <div class="no-records">

                    <lightning-icon
                        icon-name="utility:success"
                        alternative-text="No Tasks"
                        size="medium">
                    </lightning-icon>

                    <p>
                        No requirements assigned to you.
                    </p>

                </div>

            </template>


            <!-- Table -->
            <template if:true={hasRequirements}>

                <div class="table-wrapper">

                    <table class="requirements-table">

                        <thead>

                            <tr>
                                <th>#</th>
                                <th>Requirement</th>
                                <th>Description</th>
                                <th>Status</th>
                                <th>Action</th>
                                <th>Started On</th>
                                <th>Completed On</th>
                            </tr>

                        </thead>


                        <tbody>

                            <template
                                for:each={requirements}
                                for:item="requirement">

                                <tr key={requirement.Id}>

                                    <!-- Number -->
                                    <td>
                                        {requirement.rowNumber}
                                    </td>


                                    <!-- Requirement Name -->
                                    <td>
                                        <div class="requirement-name">
                                            {requirement.Name}
                                        </div>
                                    </td>


                                    <!-- Description -->
                                    <td>
                                        <div class="description">
                                            {requirement.Description__c}
                                        </div>
                                    </td>


                                    <!-- Status -->
                                    <td>

                                        <span class={requirement.statusClass}>
                                            {requirement.Status__c}
                                        </span>

                                    </td>


                                    <!-- Action -->
                                    <td>

                                        <!-- Start Work -->
                                        <template if:true={requirement.isNotStarted}>

                                            <button
                                                class="action-button start-button"
                                                data-id={requirement.Id}
                                                onclick={handleStart}>

                                                <lightning-icon
                                                    icon-name="utility:play"
                                                    alternative-text="Start"
                                                    size="xx-small">
                                                </lightning-icon>

                                                <span>
                                                    Start Work
                                                </span>

                                            </button>

                                        </template>


                                        <!-- Complete -->
                                        <template if:true={requirement.isInProgress}>

                                            <button
                                                class="action-button complete-button"
                                                data-id={requirement.Id}
                                                onclick={handleComplete}>

                                                <lightning-icon
                                                    icon-name="utility:check"
                                                    alternative-text="Complete"
                                                    size="xx-small">
                                                </lightning-icon>

                                                <span>
                                                    Complete
                                                </span>

                                            </button>

                                        </template>


                                        <!-- Already Completed -->
                                        <template if:true={requirement.isCompleted}>

                                            <button
                                                class="action-button completed-button"
                                                disabled>

                                                <lightning-icon
                                                    icon-name="utility:check"
                                                    alternative-text="Completed"
                                                    size="xx-small">
                                                </lightning-icon>

                                                <span>
                                                    Completed
                                                </span>

                                            </button>

                                        </template>

                                    </td>


                                    <!-- Started On -->
                                    <td>

                                        <template if:true={requirement.Started_On__c}>

                                            <lightning-formatted-date-time
                                                value={requirement.Started_On__c}
                                                day="2-digit"
                                                month="short"
                                                year="numeric"
                                                hour="2-digit"
                                                minute="2-digit">
                                            </lightning-formatted-date-time>

                                        </template>

                                        <template if:false={requirement.Started_On__c}>
                                            -
                                        </template>

                                    </td>


                                    <!-- Completed On -->
                                    <td>

                                        <template if:true={requirement.Completed_On__c}>

                                            <lightning-formatted-date-time
                                                value={requirement.Completed_On__c}
                                                day="2-digit"
                                                month="short"
                                                year="numeric"
                                                hour="2-digit"
                                                minute="2-digit">
                                            </lightning-formatted-date-time>

                                        </template>

                                        <template if:false={requirement.Completed_On__c}>
                                            -
                                        </template>

                                    </td>

                                </tr>

                            </template>

                        </tbody>

                    </table>

                </div>

            </template>


            <!-- Bottom Message -->
            <div class="card-footer">

                <lightning-icon
                    icon-name="utility:info"
                    alternative-text="Information"
                    size="xx-small">
                </lightning-icon>

                <span>
                    Update your status daily to keep your progress visible.
                </span>

            </div>

        </section>

    </main>


    <!-- Footer -->
    <footer class="page-footer">

        © 2026 Work Tracker | All rights reserved.

    </footer>

</template>
